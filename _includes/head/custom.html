<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
<link rel="apple-touch-icon" href="{{ '/assets/profile.jpg' | relative_url }}" />

<!-- Preconnect to Google Fonts to cut connection setup time. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- Apply saved theme before paint to avoid a flash of the wrong colors. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('pt-theme');
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      var theme = saved || (prefersLight ? 'light' : 'dark');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {
      console.warn("Saved theme could not be read", e);
    }
  })();
</script>

<!-- Font Awesome 6 for the X logo (theme ships FA 5, which has no X icon). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />
